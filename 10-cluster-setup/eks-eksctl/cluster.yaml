apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: k8s-lab
  region: ap-south-1          # <-- change me
  version: "1.31"
iam:
  withOIDC: true              # enables IRSA
managedNodeGroups:
  - name: ng-general
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 4
    volumeSize: 30
    labels: {role: general}
    iam:
      withAddonPolicies:
        ebs: true
        albIngress: true
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies: {ebsCSIController: true}
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
