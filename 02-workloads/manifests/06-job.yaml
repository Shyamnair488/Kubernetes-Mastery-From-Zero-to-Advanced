apiVersion: batch/v1
kind: Job
metadata: {name: pi, namespace: lab}
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          image: perl:5.40
          command: ["perl","-Mbignum=bpi","-wle","print bpi(200)"]
