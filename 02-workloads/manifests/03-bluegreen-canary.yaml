# BLUE/GREEN: switch traffic by editing the Service selector (version: blue -> green)
# CANARY: both Deployments share label app=shop; Service selects app only, so
#         traffic splits proportional to replica counts (9 stable : 1 canary = ~10%).
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-stable, namespace: lab}
spec:
  replicas: 3
  selector: {matchLabels: {app: shop, track: stable}}
  template:
    metadata: {labels: {app: shop, track: stable, version: blue}}
    spec:
      containers:
        - {name: app, image: hashicorp/http-echo:1.0, args: ["-text=STABLE v1"], ports: [{containerPort: 5678}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-canary, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop, track: canary}}
  template:
    metadata: {labels: {app: shop, track: canary, version: green}}
    spec:
      containers:
        - {name: app, image: hashicorp/http-echo:1.0, args: ["-text=CANARY v2"], ports: [{containerPort: 5678}]}
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: lab}
spec:
  selector: {app: shop}          # canary: both tracks. Blue/green: add "version: blue"
  ports: [{port: 80, targetPort: 5678}]
