apiVersion: apps/v1
kind: Deployment
metadata: {name: kubelab-api, namespace: kubelab}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: kubelab-api}}
  template:
    metadata: {labels: {app: kubelab-api, tier: api}}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: api
          image: kubelab-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: kubelab-config}}]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: kubelab-secret, key: DB_PASSWORD}}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: kubelab-api, namespace: kubelab}
spec:
  selector: {app: kubelab-api}
  ports: [{port: 80, targetPort: 8080}]
