apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: kubelab-api, namespace: kubelab}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kubelab-api}
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
