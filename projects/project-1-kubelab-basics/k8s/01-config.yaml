apiVersion: v1
kind: ConfigMap
metadata: {name: kubelab-config, namespace: kubelab}
data:
  DB_HOST: postgres
  DB_NAME: kubelab
  DB_USER: kubelab
  APP_VERSION: "1.0"
---
apiVersion: v1
kind: Secret
metadata: {name: kubelab-secret, namespace: kubelab}
type: Opaque
stringData:
  DB_PASSWORD: "change-me-lab-only"
  POSTGRES_PASSWORD: "change-me-lab-only"
