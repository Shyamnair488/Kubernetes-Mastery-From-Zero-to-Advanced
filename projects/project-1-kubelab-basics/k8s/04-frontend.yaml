apiVersion: v1
kind: ConfigMap
metadata: {name: frontend-nginx, namespace: kubelab}
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/html;
        return 200 '<h1>KubeLab</h1><p>Try <a href="/api/visit">/api/visit</a></p>';
      }
      location /api/ {
        proxy_pass http://kubelab-api.kubelab.svc.cluster.local;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: kubelab}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: frontend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
          readinessProbe: {httpGet: {path: /, port: 80}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - {name: conf, configMap: {name: frontend-nginx}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: kubelab}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
