apiVersion: v1
kind: Service
metadata:
  name: sample-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # with AWS LB Controller installed you may use: service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  selector: {app: sample-app}
  ports: [{port: 80, targetPort: 8080}]
