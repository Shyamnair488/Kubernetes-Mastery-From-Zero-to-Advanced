# Use with: envsubst < ec2nodeclass.yaml | kubectl apply -f -
# Requires env: CLUSTER_NAME, KARPENTER_NODE_ROLE (e.g. KarpenterNodeRole-k8s-lab)
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest          # pin a specific version in production
  role: "${KARPENTER_NODE_ROLE}"
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: "${CLUSTER_NAME}"}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: "${CLUSTER_NAME}"}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: {volumeSize: 40Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true}
  tags:
    Project: k8s-mastery
    ManagedBy: karpenter
