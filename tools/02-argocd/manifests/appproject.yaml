apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: team-a, namespace: argocd}
spec:
  description: Team A applications
  sourceRepos: ["https://github.com/<your-username>/*"]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: "team-a-*"}
  clusterResourceWhitelist: []          # no cluster-scoped kinds
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
  roles:
    - name: read-only
      policies: ["p, proj:team-a:read-only, applications, get, team-a/*, allow"]
