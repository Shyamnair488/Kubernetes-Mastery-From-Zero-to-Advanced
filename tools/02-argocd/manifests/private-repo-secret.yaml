# TEMPLATE: never commit real tokens. Create with kubectl instead:
# kubectl create secret generic repo-creds -n argocd --from-literal=url=https://github.com/<you>/<repo>.git --from-literal=username=<user> --from-literal=password=<PAT>
# kubectl label secret repo-creds -n argocd argocd.argoproj.io/secret-type=repository
apiVersion: v1
kind: Secret
metadata:
  name: repo-creds
  namespace: argocd
  labels: {argocd.argoproj.io/secret-type: repository}
stringData:
  type: git
  url: https://github.com/<your-username>/<private-repo>.git
  username: <user>
  password: <PERSONAL_ACCESS_TOKEN>
