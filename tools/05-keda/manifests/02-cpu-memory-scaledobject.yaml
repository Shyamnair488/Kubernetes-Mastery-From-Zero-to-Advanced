apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: php-apache-cpu, namespace: lab}
spec:
  scaleTargetRef: {name: php-apache}
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: cpu
      metricType: Utilization
      metadata: {value: "50"}
    - type: memory
      metricType: Utilization
      metadata: {value: "70"}
