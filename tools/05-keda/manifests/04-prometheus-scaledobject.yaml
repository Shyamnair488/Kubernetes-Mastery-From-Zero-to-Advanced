# Requires Prometheus (see 08-observability) - scale on request rate
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: web-prom, namespace: lab}
spec:
  scaleTargetRef: {name: web}
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
        query: sum(rate(nginx_ingress_controller_requests{service="web"}[2m]))
        threshold: "100"        # ~100 req/s per replica
