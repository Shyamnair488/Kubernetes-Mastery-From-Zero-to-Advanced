replicaCount: 3
env: {APP_ENV: prod, LOG_LEVEL: warn}
autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 60}
pdb: {enabled: true, minAvailable: 2}
ingress:
  enabled: true
  hosts:
    - host: kubelab.example.com
      paths: [{path: /, pathType: Prefix}]
resources:
  requests: {cpu: 200m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
