apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: high-priority}
value: 100000
globalDefault: false
description: "Critical business workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: low-priority}
value: 1000
description: "Batch / best-effort"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: spread-demo, namespace: lab}
spec:
  replicas: 6
  selector: {matchLabels: {app: spread-demo}}
  template:
    metadata: {labels: {app: spread-demo}}
    spec:
      priorityClassName: high-priority
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: spread-demo}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: spread-demo}}
      containers:
        - {name: c, image: nginx:1.27, resources: {requests: {cpu: 50m, memory: 32Mi}}}
