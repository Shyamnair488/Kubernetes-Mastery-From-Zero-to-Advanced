# 6 intentionally broken apps. Namespace: lab. Find & fix each. DO NOT read ANSWERS.md first!
# 1) ImagePull problem
apiVersion: v1
kind: Pod
metadata: {name: broken-1, namespace: lab}
spec:
  containers: [{name: c, image: "nginx:1.99.99"}]
---
# 2) CrashLoop
apiVersion: v1
kind: Pod
metadata: {name: broken-2, namespace: lab}
spec:
  containers: [{name: c, image: busybox:1.36, command: ["sh","-c","echo starting; exit 1"]}]
---
# 3) Pending (impossible resources)
apiVersion: v1
kind: Pod
metadata: {name: broken-3, namespace: lab}
spec:
  containers:
    - name: c
      image: nginx:1.27
      resources: {requests: {cpu: "100", memory: 500Gi}}
---
# 4) Service with no endpoints (label mismatch)
apiVersion: apps/v1
kind: Deployment
metadata: {name: broken-4, namespace: lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: broken-4}}
  template:
    metadata: {labels: {app: broken-4}}
    spec:
      containers: [{name: c, image: nginx:1.27, ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: broken-4, namespace: lab}
spec:
  selector: {app: broken-four}
  ports: [{port: 80, targetPort: 80}]
---
# 5) Never Ready (bad readiness probe)
apiVersion: v1
kind: Pod
metadata: {name: broken-5, namespace: lab}
spec:
  containers:
    - name: c
      image: nginx:1.27
      readinessProbe: {httpGet: {path: /does-not-exist, port: 80}, periodSeconds: 3}
---
# 6) Missing ConfigMap
apiVersion: v1
kind: Pod
metadata: {name: broken-6, namespace: lab}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep","3600"]
      envFrom: [{configMapRef: {name: ghost-config}}]
