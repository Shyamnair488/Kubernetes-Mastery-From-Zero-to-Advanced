apiVersion: v1
kind: ResourceQuota
metadata: {name: lab-quota, namespace: lab}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata: {name: lab-limits, namespace: lab}
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {cpu: "1", memory: 1Gi}
      min: {cpu: 10m, memory: 8Mi}
