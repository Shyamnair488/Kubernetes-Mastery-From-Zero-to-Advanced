# Requires VPA installed: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata: {name: web-vpa, namespace: lab}
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  updatePolicy: {updateMode: "Off"}      # recommendation only
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed: {cpu: 25m, memory: 32Mi}
        maxAllowed: {cpu: "1", memory: 1Gi}
