apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-demo, namespace: lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: probe-demo}}
  template:
    metadata: {labels: {app: probe-demo}}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: nginx
          image: nginx:1.27
          ports: [{containerPort: 80}]
          startupProbe:
            httpGet: {path: /, port: 80}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: {command: ["sh","-c","sleep 10; nginx -s quit"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
