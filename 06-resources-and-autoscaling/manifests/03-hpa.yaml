apiVersion: apps/v1
kind: Deployment
metadata: {name: php-apache, namespace: lab}
spec:
  selector: {matchLabels: {run: php-apache}}
  replicas: 1
  template:
    metadata: {labels: {run: php-apache}}
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 200m}
            limits: {cpu: 500m}
---
apiVersion: v1
kind: Service
metadata: {name: php-apache, namespace: lab}
spec:
  selector: {run: php-apache}
  ports: [{port: 80}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: php-apache, namespace: lab}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: php-apache}
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies: [{type: Percent, value: 50, periodSeconds: 30}]
    scaleUp:
      policies: [{type: Pods, value: 4, periodSeconds: 30}]
