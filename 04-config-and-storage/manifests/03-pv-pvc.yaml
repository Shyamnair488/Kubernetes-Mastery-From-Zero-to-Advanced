# Static provisioning example (hostPath only for learning on minikube)
apiVersion: v1
kind: PersistentVolume
metadata: {name: pv-demo}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath: {path: /data/pv-demo}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pvc-static, namespace: lab}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  resources: {requests: {storage: 500Mi}}
---
# Dynamic provisioning (uses cluster default StorageClass, e.g. minikube "standard")
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pvc-dynamic, namespace: lab}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: pvc-demo, namespace: lab}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh","-c","echo persisted-$(date) >> /data/out.txt; cat /data/out.txt; sleep 3600"]
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: pvc-dynamic}
