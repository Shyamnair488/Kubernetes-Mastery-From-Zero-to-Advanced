apiVersion: v1
kind: Pod
metadata:
  name: downward-demo
  namespace: lab
  labels: {app: downward}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh","-c","env | grep MY_; cat /etc/podinfo/labels; sleep 3600"]
      resources: {limits: {memory: 128Mi}}
      env:
        - {name: MY_POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: MY_POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        - {name: MY_NODE, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: MY_MEM_LIMIT, valueFrom: {resourceFieldRef: {containerName: c, resource: limits.memory}}}
      volumeMounts: [{name: podinfo, mountPath: /etc/podinfo}]
  volumes:
    - name: podinfo
      downwardAPI:
        items:
          - {path: labels, fieldRef: {fieldPath: metadata.labels}}
