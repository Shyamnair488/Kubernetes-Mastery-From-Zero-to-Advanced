apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: lab}
data:
  LOG_LEVEL: debug
  APP_ENV: dev
  app.properties: |
    feature.x=true
    timeout=30
---
apiVersion: v1
kind: Secret
metadata: {name: app-secret, namespace: lab}
type: Opaque
stringData:                 # plain text here; stored base64 by the API server
  DB_PASSWORD: "demo-password-change-me"
  API_KEY: "demo-key"
---
apiVersion: v1
kind: Pod
metadata: {name: config-demo, namespace: lab}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","env | sort; echo ---; cat /etc/config/app.properties; sleep 3600"]
      envFrom:
        - configMapRef: {name: app-config}
      env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
      volumeMounts:
        - {name: cfg, mountPath: /etc/config, readOnly: true}
        - {name: sec, mountPath: /etc/secret, readOnly: true}
  volumes:
    - name: cfg
      configMap: {name: app-config}
    - name: sec
      secret: {secretName: app-secret}
