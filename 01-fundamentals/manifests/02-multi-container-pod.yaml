# Sidecar pattern: app writes logs to a shared emptyDir, sidecar reads them.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: lab
spec:
  volumes:
    - name: logs
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh","-c","while true; do echo $(date) hello >> /var/log/app.log; sleep 2; done"]
      volumeMounts:
        - {name: logs, mountPath: /var/log}
    - name: log-shipper
      image: busybox:1.36
      command: ["sh","-c","tail -F /var/log/app.log"]
      volumeMounts:
        - {name: logs, mountPath: /var/log}
