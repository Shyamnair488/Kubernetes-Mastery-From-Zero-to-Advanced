apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: backups.demo.example.com}
spec:
  group: demo.example.com
  scope: Namespaced
  names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [schedule, target]
              properties:
                schedule: {type: string}
                target: {type: string}
                retentionDays: {type: integer, minimum: 1, default: 7}
            status:
              type: object
              properties: {lastRun: {type: string}}
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Schedule, type: string, jsonPath: .spec.schedule}
        - {name: Target, type: string, jsonPath: .spec.target}
---
apiVersion: demo.example.com/v1
kind: Backup
metadata: {name: nightly, namespace: lab}
spec: {schedule: "0 2 * * *", target: s3://my-bucket/db, retentionDays: 14}
