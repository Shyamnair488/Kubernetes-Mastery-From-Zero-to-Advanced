apiVersion: apps/v1
kind: Deployment
metadata: {name: init-demo, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: init-demo}}
  template:
    metadata: {labels: {app: init-demo}}
    spec:
      initContainers:
        - name: wait-for-web
          image: busybox:1.36
          command: ["sh","-c","until nslookup web.lab.svc.cluster.local; do echo waiting for web; sleep 2; done"]
        - name: fetch-config
          image: busybox:1.36
          command: ["sh","-c","echo 'generated-at='$(date) > /work/config.txt"]
          volumeMounts: [{name: work, mountPath: /work}]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh","-c","cat /work/config.txt; sleep 3600"]
          volumeMounts: [{name: work, mountPath: /work}]
      volumes:
        - {name: work, emptyDir: {}}
