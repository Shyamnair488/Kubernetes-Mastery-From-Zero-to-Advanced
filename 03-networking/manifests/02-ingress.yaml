apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - {name: api, image: hashicorp/http-echo:1.0, args: ["-text=Hello from API"], ports: [{containerPort: 5678}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: lab}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
# TLS example (create secret first: kubectl create secret tls shop-tls --cert=tls.crt --key=tls.key -n lab)
